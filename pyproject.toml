[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achados"
version = "0.1.0"
description = "Coleta de ofertas (Shopee, Mercado Livre) para canais de achadinhos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "selectolax>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
achados = "achados.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
